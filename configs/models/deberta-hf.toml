# DeBERTa-v3-base, fine-tuned in Phase 3 (configs/models/deberta.toml), loaded
# from the published weights instead of a local checkpoint. 512-token context.

[detector]
class = "phishbench.detectors.encoder:TransformerEncoderDetector"
data_allowed = ["train: fit (done in Phase 3)", "validation: threshold"]

[detector.params]
model_name_or_path = "iceninja3/phishing-deberta-v3-base"
revision = "bb72e5d9cf3f181c0293475c74ec4abf9bb4c0e0"
pretrained = true
checkpoint_dir = "checkpoints/hf/phishing-deberta-v3-base"  # used if present (same files, downloaded by hand); else the Hub
name = "deberta-v3-base"
max_length = 512
eval_batch_size = 16

[eval]
warmup = 3
batch_size = 16
