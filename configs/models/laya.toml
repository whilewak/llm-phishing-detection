# Laya System 1 decision model, zero-shot with the POC's hand-picked signal weights.
# Phase 3 replaces the weights with ones fitted on the validation split.

[detector]
class = "phishbench.detectors.laya:LayaDetector"
data_allowed = ["validation: fit signal weights and threshold"]

[detector.params]
default_model = "english"
risk_threshold = 1.05
fit_weights_on_val = true

[eval]
warmup = 3
batch_size = 1
