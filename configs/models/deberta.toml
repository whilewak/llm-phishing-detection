# Fine-tuned DeBERTa-v3-base encoder (512 max context)

[detector]
class = "phishbench.detectors.encoder:TransformerEncoderDetector"
data_allowed = ["train: fit", "validation: threshold"]

[detector.params]
model_name_or_path = "microsoft/deberta-v3-base"
name = "deberta-v3-base"
max_length = 512
batch_size = 8
gradient_accumulation_steps = 2
eval_batch_size = 16
epochs = 2
lr = 1e-5
max_train_samples = 1500
checkpoint_dir = "checkpoints/deberta_v3_base"

[eval]
warmup = 3
batch_size = 16
