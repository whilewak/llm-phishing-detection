# GPT-6.1 Sol, zero-shot, 0-100 score
# Phase 5 frontier LLM via Amazon Bedrock (global cross-Region inference, us-west-1).
# Needs AWS_BEARER_TOKEN_BEDROCK. Responses are cached in data/cache/llm/, so reruns are free.

[detector]
class = "phishbench.detectors.openai_llm:OpenAIDetector"
data_allowed = ["val_llm: threshold"]

[detector.params]
name = "gpt-6.1-sol-zeroshot"
model = "global.openai.gpt-6.1-sol"
region = "us-west-1"
prices = { input = 2.00, cache_write = 2.50, cache_read = 0.10, output = 10.00 }  # $/1M, Bedrock global = OpenAI list
effort = "low"  # lowest Sol allows; "none" is not supported, so no temperature or logprobs
max_output_tokens = 2048  # reasoning tokens count against this
max_total_cost_usd = 45
concurrency = 8
max_input_chars = 32000

[eval]
warmup = 1
batch_size = 16
