# TF-IDF + Logistic Regression baseline detector.
# Statistical NLP model trained on train split.

[detector]
class = "phishbench.detectors.tfidf_lr:TfidfLogisticRegressionDetector"
data_allowed = ["train: fit", "validation: threshold"]

[detector.params]
max_features = 50000
ngram_range = [1, 2]
sublinear_tf = true
c_reg = 1.0
class_weight = "balanced"
max_iter = 1000

[eval]
warmup = 3
batch_size = 100

