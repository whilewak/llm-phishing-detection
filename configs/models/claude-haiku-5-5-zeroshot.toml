# Claude Haiku 5.5, zero-shot, 0-100 score
# Phase 5 frontier LLM via Amazon Bedrock (global cross-Region inference, us-west-1).
# Needs AWS_BEARER_TOKEN_BEDROCK. Responses are cached in data/cache/llm/, so reruns are free.

[detector]
class = "phishbench.detectors.claude:ClaudeDetector"
data_allowed = ["val_llm: threshold"]

[detector.params]
name = "claude-haiku-5-5-zeroshot"
model = "global.anthropic.claude-haiku-5-5"
region = "us-west-1"
prices = { input = 0.10, cache_write = 0.125, cache_read = 0.01, output = 0.50 }  # $/1M, prompts <=100k tokens
thinking = { type = "disabled" }
effort = "low"
max_output_tokens = 256
max_total_cost_usd = 5
concurrency = 8
max_input_chars = 32000

[eval]
warmup = 1
batch_size = 16
