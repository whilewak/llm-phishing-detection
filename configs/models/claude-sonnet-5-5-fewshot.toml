# Claude Sonnet 5.5, 8-example few-shot, 0-100 score
# Phase 5 frontier LLM. Default backend: Anthropic's API (needs ANTHROPIC_API_KEY).
# To use Amazon Bedrock instead: backend = "bedrock", model = "global.anthropic.claude-sonnet-5-5",
# region = the region your Bedrock API key was issued in (needs AWS_BEARER_TOKEN_BEDROCK).
# Responses are cached in data/cache/llm/, so reruns are free.

[detector]
class = "phishbench.detectors.claude:ClaudeDetector"
data_allowed = ["train: few-shot pool", "val_llm: threshold"]

[detector.params]
name = "claude-sonnet-5-5-fewshot"
backend = "anthropic"
model = "claude-sonnet-5-5"
prices = { input = 2.00, cache_write = 2.50, cache_read = 0.10, output = 10.00 }  # $/1M tokens, Anthropic list price
thinking = { type = "between_tools" }  # thinking off; "disabled" is a 400 on Sonnet 5.5
effort = "low"
max_output_tokens = 256
max_total_cost_usd = 25
concurrency = 8
max_input_chars = 32000
few_shot = "configs/prompts/fewshot-champa2023-v1.json"
split_dir = "data/splits/champa2023-v1"

[eval]
warmup = 1
batch_size = 16
